<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ProScreen — Redirecting...</title>
    <script>
      // Single Page Application redirect for GitHub Pages
      // Encodes path into hash and reloads index.html
      (function () {
        var pathSegments = window.location.pathname.split('/').filter(Boolean);
        var repoName = 'proscreen';
        var subPath = pathSegments.filter(function (s) { return s !== repoName; }).join('/');
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        var newHash = subPath ? '#/' + subPath : hash;
        window.location.replace('/' + repoName + '/' + search + newHash);
      })();
    </script>
  </head>
  <body style="background:#060913;color:#94a3b8;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
    <p>Redirecting to ProScreen...</p>
  </body>
</html>
